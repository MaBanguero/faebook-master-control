<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FaeBook Master Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
              400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
              800: '#3730a3', 900: '#312e81', 950: '#1e1b4b',
            }
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Inter', system-ui, sans-serif; }
    body { background: #0f172a; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; }
    .card-hover:hover { border-color: #6366f1; transition: border-color 0.2s; }
    .btn-primary { background: #6366f1; color: white; border-radius: 8px; padding: 8px 16px; font-weight: 500; transition: all 0.2s; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { background: #dc2626; color: white; border-radius: 8px; padding: 8px 16px; font-weight: 500; transition: all 0.2s; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-ghost { background: transparent; color: #94a3b8; border-radius: 8px; padding: 8px 16px; font-weight: 500; transition: all 0.2s; }
    .btn-ghost:hover { background: #334155; color: #e2e8f0; }
    .conn-badge { display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 600; }
    .conn-online { background: rgba(34,197,94,0.15); color: #22c55e; }
    .conn-offline { background: rgba(239,68,68,0.15); color: #ef4444; }
    .conn-unknown { background: rgba(148,163,184,0.1); color: #64748b; }
    .input { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 14px; color: #e2e8f0; width: 100%; transition: border-color 0.2s; }
    .input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
    .input::placeholder { color: #475569; }
    textarea.input { resize: vertical; min-height: 80px; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-green { background: rgba(34,197,94,0.15); color: #22c55e; }
    .badge-yellow { background: rgba(234,179,8,0.15); color: #eab308; }
    .badge-red { background: rgba(239,68,68,0.15); color: #ef4444; }
    .badge-blue { background: rgba(99,102,241,0.15); color: #818cf8; }
    .badge-gray { background: rgba(148,163,184,0.1); color: #64748b; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; color: #94a3b8; font-weight: 500; transition: all 0.15s; cursor: pointer; }
    .nav-item:hover { background: #1e293b; color: #e2e8f0; }
    .nav-item.active { background: rgba(99,102,241,0.12); color: #818cf8; }
    .toast { position: fixed; top: 20px; right: 20px; z-index: 9999; animation: slideIn 0.3s ease; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .progress-bar { height: 4px; background: #334155; border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #818cf8); border-radius: 2px; transition: width 0.5s ease; }
    .tab { padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.15s; color: #64748b; }
    .tab:hover { color: #e2e8f0; background: #1e293b; }
    .tab.active { background: #6366f1; color: white; }
    /* Streaming full-height */
    .stream-full { display: flex; flex-direction: column; height: calc(100vh - 80px); }
    .stream-controls { flex-shrink: 0; display: flex; gap: 12px; align-items: center; padding: 10px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 12px; margin-bottom: 10px; }
    .stream-video-wrap { flex: 1; background: #0b1120; border: 1px solid #334155; border-radius: 12px; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center; touch-action: none; cursor: crosshair; }
    .stream-video-wrap img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
    .stream-stats-bar { flex-shrink: 0; display: flex; gap: 16px; padding: 8px 16px; margin-top: 8px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; }
    .stream-stats-bar .stat-item { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .stream-stats-bar .stat-label { color: #64748b; }
    .stream-stats-bar .stat-val { font-weight: 600; }
    .no-padding { padding: 0 !important; }
    .select-sm { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; color: #e2e8f0; font-size: 13px; cursor: pointer; outline: none; min-width: 280px; }
    .select-sm:focus { border-color: #6366f1; }
    /* Mobile */
    .menu-toggle { display: none; background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer; padding: 4px 8px; }
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 40; }
    @media (max-width: 768px) {
      .menu-toggle { display: block; }
      aside { position: fixed; left: -260px; top: 0; bottom: 0; z-index: 50; transition: left 0.25s; }
      aside.open { left: 0; }
      .sidebar-overlay.show { display: block; }
      main { padding: 8px !important; }
      .stream-full { height: calc(100vh - 110px) !important; }
      .stream-controls { flex-wrap: wrap; gap: 6px; padding: 8px 10px; }
      .stream-controls h2 { font-size: 0.85rem; }
      .select-sm { min-width: 0; flex: 1; font-size: 12px; padding: 6px 8px; }
      .stream-stats-bar { flex-wrap: wrap; gap: 8px; padding: 6px 10px; font-size: 11px; }
      .stream-stats-bar .stat-item { font-size: 11px; }
      .stream-video-wrap { border-radius: 8px; }
      .card { padding: 10px !important; }
    }
    .checkbox-group label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; transition: background 0.15s; }
    .checkbox-group label:hover { background: #1e293b; }
    .checkbox-group input[type="checkbox"] { accent-color: #6366f1; width: 16px; height: 16px; }
    .spinner { width: 18px; height: 18px; border: 2px solid #334155; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex">
  <!-- Mobile menu button -->
  <button class="menu-toggle fixed top-3 left-3 z-50" onclick="toggleSidebar()" aria-label="Menú">☰</button>
  <!-- Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <!-- Sidebar -->
  <aside class="w-60 bg-[#0b1120] border-r border-slate-800 flex flex-col shrink-0">
    <div class="p-5 border-b border-slate-800">
      <h1 class="text-lg font-bold tracking-tight">
        <span class="text-brand-400">Fae</span><span class="text-white">Book</span>
      </h1>
      <p class="text-xs text-slate-500 mt-1">Master Control Panel</p>
    </div>
    <nav class="flex-1 p-3 space-y-1" id="sidebar-nav">
      <div class="nav-item active" data-page="dashboard">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
        Dashboard
      </div>
      <div class="nav-item" data-page="facebook">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Facebook
      </div>
      <div class="nav-item" data-page="tiktok">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z"/></svg>
        TikTok
      </div>
      <div class="nav-item" data-page="instagram">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C8.74 0 8.333.015 7.053.072 5.775.132 4.905.333 4.14.63c-.789.306-1.459.717-2.126 1.384S.935 3.35.63 4.14C.333 4.905.131 5.775.072 7.053.012 8.333 0 8.74 0 12s.015 3.667.072 4.947c.06 1.277.261 2.148.558 2.913.306.788.717 1.459 1.384 2.126.667.666 1.336 1.079 2.126 1.384.766.296 1.636.499 2.913.558C8.333 23.988 8.74 24 12 24s3.667-.015 4.947-.072c1.277-.06 2.148-.262 2.913-.558.788-.306 1.459-.718 2.126-1.384.666-.667 1.079-1.335 1.384-2.126.296-.765.499-1.636.558-2.913.06-1.28.072-1.687.072-4.947s-.015-3.667-.072-4.947c-.06-1.277-.262-2.149-.558-2.913-.306-.789-.718-1.459-1.384-2.126C21.319 1.347 20.651.935 19.86.63c-.765-.297-1.636-.499-2.913-.558C15.667.012 15.26 0 12 0zm0 2.16c3.203 0 3.585.016 4.85.071 1.17.055 1.805.249 2.227.415.562.217.96.477 1.382.896.419.42.679.819.896 1.381.164.422.36 1.057.413 2.227.057 1.266.07 1.646.07 4.85s-.015 3.585-.074 4.85c-.061 1.17-.256 1.805-.421 2.227-.224.562-.479.96-.899 1.382-.419.419-.824.679-1.38.896-.42.164-1.065.36-2.235.413-1.274.057-1.649.07-4.859.07-3.211 0-3.586-.015-4.859-.074-1.171-.061-1.816-.256-2.236-.421-.569-.224-.96-.479-1.379-.899-.421-.419-.69-.824-.9-1.38-.165-.42-.359-1.065-.42-2.235-.045-1.26-.061-1.649-.061-4.844 0-3.196.016-3.586.061-4.861.061-1.17.255-1.814.42-2.234.21-.57.479-.96.9-1.381.419-.419.81-.689 1.379-.898.42-.166 1.051-.361 2.221-.421 1.275-.045 1.65-.06 4.859-.06l.045.03zm0 3.678c-3.405 0-6.162 2.76-6.162 6.162 0 3.405 2.76 6.162 6.162 6.162 3.405 0 6.162-2.76 6.162-6.162 0-3.405-2.76-6.162-6.162-6.162zM12 16c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4zm7.846-10.405c0 .795-.646 1.44-1.44 1.44-.795 0-1.44-.646-1.44-1.44 0-.794.646-1.439 1.44-1.439.793-.001 1.44.645 1.44 1.439z"/></svg>
        Instagram
      </div>
      <div class="nav-item" data-page="streaming">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
        Streaming
      </div>
    </nav>
    <div class="p-3 border-t border-slate-800" id="server-status">
      <div class="flex items-center gap-2 px-3 py-2 text-xs text-slate-500">
        <span class="w-2 h-2 rounded-full bg-slate-600" id="status-dot"></span>
        <span id="status-text">Conectando...</span>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-auto p-6" id="main-content">
    <!-- Rendered dynamically -->
  </main>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script>
    const API = location.origin;
    let currentPage = 'dashboard';
    let devices = [];
    let tasks = [];
    let connectivityData = {};
    let pollInterval = null;

    // ── Navigation ──
    function toggleSidebar() {
      document.querySelector('aside').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('show');
    }
    document.getElementById('sidebar-nav').addEventListener('click', e => {
      const item = e.target.closest('.nav-item');
      if (!item) return;
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      item.classList.add('active');
      currentPage = item.dataset.page;
      renderPage();
      if (currentPage === 'dashboard') startPolling(); else stopPolling();
      // Cerrar sidebar en mobile
      document.querySelector('aside').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('show');
    });

    // ── Toast ──
    function toast(msg, type = 'info') {
      const colors = { success: 'bg-green-900 border-green-700 text-green-200', error: 'bg-red-900 border-red-700 text-red-200', info: 'bg-brand-900 border-brand-700 text-brand-200' };
      const el = document.createElement('div');
      el.className = `toast ${colors[type]} px-4 py-3 rounded-lg border shadow-lg text-sm font-medium`;
      el.textContent = msg;
      document.getElementById('toast-container').appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; setTimeout(() => el.remove(), 300); }, 3500);
    }

    // ── API ──
    async function api(path, opts = {}) {
      try {
        const res = await fetch(API + path, { headers: { 'Content-Type': 'application/json' }, ...opts });
        if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.detail || res.statusText); }
        return res.json();
      } catch (err) {
        if (err.message.includes('Failed to fetch')) { document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-red-500'; document.getElementById('status-text').textContent = 'Sin conexión'; }
        throw err;
      }
    }

    // ── Device Polling ──
    async function fetchDevices() {
      try {
        devices = await api('/api/dispositivos');
        document.getElementById('status-dot').className = 'w-2 h-2 rounded-full bg-green-500';
        document.getElementById('status-text').textContent = `${devices.length} dispositivos`;
      } catch (e) { /* handled in api() */ }
    }

    async function fetchTasks() {
      try { tasks = await api('/api/tareas'); } catch (e) { /* */ }
    }

    async function fetchConnectivity() {
      try {
        const data = await api('/api/conectividad/estado');
        data.dispositivos.forEach(d => { connectivityData[d.adb_id] = d; });
      } catch (e) { /* */ }
    }

    async function runConnectivityCheck() {
      toast('🔍 Verificando conectividad en 38 dispositivos...', 'info');
      try {
        const data = await api('/api/conectividad/verificar', { method: 'POST', body: '{}' });
        data.dispositivos.forEach(d => { connectivityData[d.adb_id] = d; });
        toast(`✅ ${data.internet}/${data.total} con internet`, 'success');
        if (currentPage === 'dashboard') renderDashboard();
      } catch (e) {
        toast(`❌ ${e.message}`, 'error');
      }
    }

    async function stopAllTasks() {
      if (!confirm('¿Detener TODAS las tareas activas?')) return;
      try {
        const res = await api('/api/tareas/detener-todas', { method: 'POST' });
        toast(`⏹ ${res.message}`, 'success');
        fetchTasks().then(renderDashboard);
      } catch(e) { toast('❌ Error', 'error'); }
    }

    function startPolling() {
      fetchDevices(); fetchTasks();
      pollInterval = setInterval(() => { fetchDevices(); fetchTasks(); if (currentPage === 'dashboard') renderDashboard(); }, 10000);
    }

    function stopPolling() {
      if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
    }

    // ── Render ──
    function renderPage() {
      const main = document.getElementById('main-content');
      main.className = '';  // restaurar padding
      stopPolling();
      stopStreamingPolling();
      switch (currentPage) {
        case 'dashboard': startPolling(); fetchDevices().then(() => fetchTasks().then(renderDashboard)); break;
        case 'facebook': renderPlatform('facebook', 'fb'); break;
        case 'tiktok': renderPlatform('tiktok', 'tt'); break;
        case 'instagram': renderPlatform('instagram', 'ig'); break;
        case 'streaming': startStreamingPolling(); renderStreaming(); break;
      }
    }

    // ── Dashboard ──
    function renderDashboard() {
      const active = tasks.filter(t => ['iniciando','ejecutando','deteniendo'].includes(t.estado));
      const completedToday = tasks.filter(t => t.estado === 'completada').length;
      const inactivos = devices.filter(d => d.estado === 'inactivo').length;
      const trabajando = devices.filter(d => ['en_tarea','trabajando'].includes(d.estado)).length;

      document.getElementById('main-content').innerHTML = `
        <div class="space-y-6">
          <div>
            <h2 class="text-xl font-semibold">Dashboard</h2>
            <p class="text-sm text-slate-400 mt-1">Resumen del sistema de automatización</p>
          </div>

          <!-- Stats -->
          <div class="grid grid-cols-5 gap-4">
            <div class="card p-5"><p class="text-xs text-slate-400 uppercase tracking-wide">Dispositivos</p><p class="text-2xl font-bold mt-2">${devices.length}</p><p class="text-xs text-slate-500 mt-1">${inactivos} inactivos · ${trabajando} ocupados</p></div>
            <div class="card p-5 cursor-pointer hover:border-red-500" onclick="stopAllTasks()"><p class="text-xs text-slate-400 uppercase tracking-wide">Tareas Activas</p><p class="text-2xl font-bold mt-2">${active.length}</p><p class="text-xs text-slate-500 mt-1">click ⏹ para detener todas</p></div>
            <div class="card p-5"><p class="text-xs text-slate-400 uppercase tracking-wide">Completadas</p><p class="text-2xl font-bold mt-2">${completedToday}</p><p class="text-xs text-slate-500 mt-1">total histórico</p></div>
            <div class="card p-5"><p class="text-xs text-slate-400 uppercase tracking-wide">Plataformas</p><p class="text-2xl font-bold mt-2">3</p><p class="text-xs text-slate-500 mt-1">FB · TT · IG</p></div>
            <div class="card p-5 cursor-pointer hover:border-brand-400" onclick="runConnectivityCheck()">
              <p class="text-xs text-slate-400 uppercase tracking-wide">Internet 🌐</p>
              <p class="text-2xl font-bold mt-2" id="conn-count">--</p>
              <p class="text-xs text-slate-500 mt-1">click para verificar</p>
            </div>
          </div>

          <!-- Device Grid -->
          <div class="card p-5">
            <h3 class="text-sm font-semibold mb-4">Dispositivos</h3>
            <div class="grid grid-cols-4 gap-3" id="device-grid">
              ${devices.map(d => {
                const colors = { inactivo: 'badge-gray', en_tarea: 'badge-yellow', trabajando: 'badge-blue', error: 'badge-red' };
                const c = connectivityData[d.adb_id];
                const connCls = c ? (c.internet ? 'conn-online' : 'conn-offline') : 'conn-unknown';
                const connLabel = c ? (c.internet ? '🟢' : '🟡') : '⚪';
                const speedInfo = c && c.link_speed ? ' · ' + c.link_speed : '';
                return `<div class="card card-hover p-3">
                  <div class="flex items-center justify-between mb-2">
                    <span class="font-mono text-xs text-slate-400 truncate" title="${d.id}">${d.id.slice(0,16)}…</span>
                    <span class="badge ${colors[d.estado] || 'badge-gray'}">${d.estado}</span>
                  </div>
                  <p class="text-xs text-slate-500">${d.nombre || 'Sin nombre'}</p>
                  <div class="flex items-center gap-1 mt-1">
                    <span class="conn-badge ${connCls}">${connLabel}${speedInfo}</span>
                  </div>
                </div>`;
              }).join('')}
            </div>
          </div>

          <!-- Active Tasks -->
          ${active.length > 0 ? `
          <div class="card p-5">
            <h3 class="text-sm font-semibold mb-4">Tareas Activas</h3>
            <div class="space-y-3">
              ${active.map(t => {
                const pct = t.metricas.total_esperado > 0 ? ((t.metricas.exitosos + t.metricas.fallidos) / t.metricas.total_esperado * 100).toFixed(0) : 0;

    async function runFlow(platform) {
      const prefix = { facebook: 'fb', tiktok: 'tt', instagram: 'ig' }[platform];
      const link = document.getElementById(`${prefix}-link`).value.trim();
      const commentRaw = document.getElementById(`${prefix}-comment`).value.trim();

      btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Ejecutando...';

      const comments = commentRaw ? commentRaw.split('\n').filter(c => c.trim()) : [];

      try {
        let endpoint, body;
        if (platform === 'facebook') {
          const cuentas = parseInt(document.getElementById('fb-cuentas')?.value || '0');
          body = { dispositivos_ids: deviceIds, link_post: link, comentario: comments.length > 0 ? comments : '', cuentas_a_usar: cuentas };

          body = { dispositivos_ids: deviceIds, link_post: link, comentario: comments.length > 0 ? comments : '' };

        toast(`❌ ${e.message}`, 'error');

        btn.disabled = false; btn.innerHTML = '🚀 Ejecutar Flujo Completo';

    async function runAction(platform, action) {

      if (!link) return toast('Ingresa la URL del post', 'error');
      if (deviceIds.length === 0) return toast('Selecciona al menos un dispositivo', 'error');

      const endpoints = {
        likes: { path: '/api/likes/facebook/ejecutar', body: d => ({ dispositivos_ids: d, link_post: link }) },
        comentarios: { path: '/api/comentarios/facebook/ejecutar', body: d => ({ dispositivos_ids: d, link_post: link, comentario: commentRaw ? commentRaw.split('\n').filter(c => c.trim()) : [] }) },
        compartir: { path: '/api/compartir/facebook/ejecutar', body: d => ({ dispositivos_ids: d, link_post: link }) },
        cambiar_cuentas: { path: '/api/cuentas/facebook/cambiar', body: d => ({ dispositivos_ids: d }) },
      };

      const cfg = endpoints[action];
      if (!cfg) return;

      try {
        const res = await api(cfg.path, { method: 'POST', body: JSON.stringify(cfg.body(deviceIds)) });
        toast(`✅ ${action} iniciado`, 'success');
      } catch (e) {
        toast(`❌ ${e.message}`, 'error');

    // ── AI Comment Generation ──
    async function generateComments(platform, prefix) {

      if (count < 1 || count > 30) return toast('Cantidad debe ser entre 1 y 30', 'error');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Generando...';

      try {
        const res = await api('/api/comentarios/generar', {
          method: 'POST',
          body: JSON.stringify({ tema: topic, cantidad: count })
        });

        const textarea = document.getElementById(`${prefix}-comment`);
        textarea.value = res.comentarios.join('\\n');
        toast(`✅ ${res.comentarios.length} comentarios generados`, 'success');
      } catch (e) {

    // ── Streaming Dashboard ────────────────────────────────────
    let streamWs = null;
    let streamDevice = null;
    let streamStatsInterval = null;
    let streamReconnectTimer = null;
    let streamScreenW = 1080, streamScreenH = 1920;
    let streamTouchStart = null;

    function startStreamingPolling() {
      fetchDevices();
      streamStatsInterval = setInterval(() => {
        if (streamDevice) fetchStreamStats(streamDevice);
      }, 2000);
    }

    function stopStreamingPolling() {
      if (streamStatsInterval) { clearInterval(streamStatsInterval); streamStatsInterval = null; }
      disconnectStream();
    }

    function renderStreaming() {
      document.getElementById('main-content').className = 'no-padding';
      document.getElementById('main-content').innerHTML = `

          <!-- Área de video (todo el espacio disponible) -->
          <div class="stream-video-wrap">
            <div id="stream-placeholder" class="flex flex-col items-center justify-center text-slate-500">
              <svg class="w-20 h-20 mb-4 opacity-25" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>

            <div id="stream-status-badge" class="absolute top-3 left-3 text-xs px-3 py-1 rounded-full bg-black/70 backdrop-blur font-medium" style="display:none"></div>
          </div>

          <!-- Barra inferior: stats -->
          <div class="stream-stats-bar">
            <div class="stat-item"><span class="stat-label">📱</span><span class="stat-val text-slate-300" id="s-model">---</span></div>
            <div class="stat-item"><span class="stat-label">CPU</span><span class="stat-val text-brand-400" id="s-cpu">--%</span></div>
            <div class="stat-item"><span class="stat-label">RAM</span><span class="stat-val text-green-400" id="s-ram">-- MB</span></div>
            <div class="stat-item"><span class="stat-label">🔋</span><span class="stat-val text-yellow-400" id="s-batt">--%</span></div>
            <div class="stat-item"><span class="stat-label">🌡</span><span class="stat-val text-red-400" id="s-temp">--°C</span></div>
            <div class="flex-1"></div>
            <div class="stat-item"><span class="stat-label">Pantalla</span><span class="stat-val text-slate-400" id="s-screen">---</span></div>

          </div>

      populateStreamDeviceSelect();
    }

    function populateStreamDeviceSelect() {
      const sel = document.getElementById('stream-device-select');
      if (!sel) return;
      const currentVal = sel.value;
      sel.innerHTML = '<option value="">-- Seleccionar dispositivo --</option>';
      devices.forEach(d => {
        const selected = d.adb_id === currentVal ? 'selected' : '';
        const label = d.nombre || (d.adb_id ? d.adb_id.slice(-8) : '?');
        sel.innerHTML += `<option value="${d.adb_id}" ${selected}>${label}</option>`;
      });
    }

    function refreshStreamDevices() {
      fetchDevices().then(populateStreamDeviceSelect);
    }

    async function onStreamDeviceChange(deviceId) {
      await disconnectStream();
      if (!deviceId) {
        clearStreamStats();
        return;
      }
      streamDevice = deviceId;
      connectStream(deviceId);
      fetchStreamStats(deviceId);
      document.getElementById('stream-stop-btn').style.display = '';
      document.getElementById('stream-active-info').innerHTML =
        `<span class="badge badge-blue">Transmitiendo</span>`;
    }

    function connectStream(deviceId) {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const url = `${proto}://${location.host}/api/ws/stream/${deviceId}`;

      setStreamStatus('Conectando...', 'badge-yellow');
      streamWs = new WebSocket(url);

      streamWs.onopen = () => {
        setStreamStatus('Conectando...', 'badge-yellow');
      };

      streamWs.onmessage = (evt) => {
        // JSON messages
        if (typeof evt.data === 'string') {
          try {
            const msg = JSON.parse(evt.data);
            if (msg.type === 'screen_info') {
              streamScreenW = msg.width;
              streamScreenH = msg.height;
            }
          } catch(e) {}
          return;
        }
        // Binary → JPEG frame
        const blob = new Blob([evt.data], { type: 'image/jpeg' });
        const img = document.getElementById('stream-img');
        const oldUrl = img.src;
        img.src = URL.createObjectURL(blob);
        if (oldUrl && oldUrl.startsWith('blob:')) URL.revokeObjectURL(oldUrl);
        if (img.style.display === 'none') {
          img.style.display = 'block';
          document.getElementById('stream-placeholder').style.display = 'none';
          setupStreamTouch();
        }
        setStreamStatus('En vivo', 'badge-green');
      };

      streamWs.onclose = () => {
        setStreamStatus('Desconectado', 'badge-red');
        if (streamDevice === deviceId) {
          streamReconnectTimer = setTimeout(() => connectStream(deviceId), 2000);
        }
      };

      streamWs.onerror = () => setStreamStatus('Error', 'badge-red');
    }

    function sendCmd(type, value) {
      if (!streamWs || streamWs.readyState !== WebSocket.OPEN) return;
      const cmd = { type: type };
      if (type === 'text') cmd.text = value || '';
      streamWs.send(JSON.stringify(cmd));
    }

    function setupStreamTouch() {
      const wrap = document.querySelector('.stream-video-wrap');
      if (!wrap) return;

      const getCoords = (e) => {
        const rect = wrap.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const bx = clientX - rect.left;
        const by = clientY - rect.top;
        return { bx, by, vw: rect.width, vh: rect.height };
      };

      const mapCoords = (bx, by, vw, vh) => ({
        x: Math.round(bx / vw * streamScreenW),
        y: Math.round(by / vh * streamScreenH)
      });

      wrap.onpointerdown = (e) => {
        e.preventDefault();
        const c = getCoords(e);
        streamTouchStart = { ...mapCoords(c.bx, c.by, c.vw, c.vh), time: Date.now() };
      };

      wrap.onpointerup = (e) => {
        if (!streamTouchStart) return;
        const c = getCoords(e);
        const end = mapCoords(c.bx, c.by, c.vw, c.vh);
        const dx = end.x - streamTouchStart.x;
        const dy = end.y - streamTouchStart.y;
        const dt = Date.now() - streamTouchStart.time;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < 20 && dt < 500) {
          streamWs.send(JSON.stringify({ type: 'tap', x: end.x, y: end.y }));
        } else if (dist >= 20) {
          streamWs.send(JSON.stringify({
            type: 'swipe', x1: streamTouchStart.x, y1: streamTouchStart.y,
            x2: end.x, y2: end.y, duration: Math.min(dt, 1000)
          }));
        }
        streamTouchStart = null;
      };

      wrap.onpointerleave = () => { streamTouchStart = null; };
    }

    async function disconnectStream() {
      if (streamReconnectTimer) { clearTimeout(streamReconnectTimer); streamReconnectTimer = null; }
      // Forzar kill del pipeline en el servidor ANTES de cerrar WS
      if (streamDevice) {
        try { await fetch(API + '/api/stream/stop', { method: 'POST' }); } catch(e) {}
      }
      if (streamWs) { streamWs.close(); streamWs = null; }
      streamDevice = null;
      const img = document.getElementById('stream-img');
      const ph = document.getElementById('stream-placeholder');
      const badge = document.getElementById('stream-status-badge');
      const stopBtn = document.getElementById('stream-stop-btn');
      const info = document.getElementById('stream-active-info');
      if (img) img.style.display = 'none';
      if (ph) ph.style.display = '';
      if (badge) badge.style.display = 'none';
      if (stopBtn) stopBtn.style.display = 'none';
      if (info) info.innerHTML = '';
      clearStreamStats();
    }

    function setStreamStatus(text, cls) {
      const badge = document.getElementById('stream-status-badge');
      if (!badge) return;
      badge.textContent = text;
      badge.className = `badge ${cls}`;
      badge.style.display = '';
    }

    async function fetchStreamStats(deviceId) {
      try {
        const res = await api(`/api/dispositivo/${deviceId}/stats`);
        const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
        set('s-cpu', res.cpu_percent != null ? `${res.cpu_percent}%` : '--%');
        set('s-ram', res.ram_mb ? `${res.ram_mb} MB` : '-- MB');
        set('s-batt', res.battery_level != null ? `${res.battery_level}%` : '--%');
        set('s-temp', res.battery_temp != null ? `${res.battery_temp}°C` : '--°C');
        set('s-model', res.model || '---');
        set('s-screen', res.screen_on ? 'ON' : 'OFF');
        set('s-charge', res.battery_status || '---');
      } catch (e) { /* stats can fail silently */ }
    }

    function clearStreamStats() {
      ['s-cpu','s-ram','s-batt','s-temp','s-model','s-screen','s-charge'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.textContent = id === 's-model' ? '---' : '--';
      });
    }

    // ── Init ──
    startPolling();
    fetchDevices().then(() => fetchTasks().then(renderDashboard));
  </script>

    <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 12px;background:#1e293b;flex-shrink:0">
      <span style="font-size:12px;font-weight:600;color:#94a3b8">📋 Logs del Servidor</span>
      <button onclick="toggleLogPanel()" style="background:none;border:none;color:#ef4444;font-size:18px;cursor:pointer">✕</button>
    </div>
    <pre id="log-content" style="flex:1;overflow-y:auto;margin:0;padding:8px 12px;font-family:monospace;font-size:11px;color:#94a3b8;line-height:1.5;white-space:pre-wrap;word-break:break-all"></pre>
  </div>
  <button id="log-toggle-btn" onclick="toggleLogPanel()" style="position:fixed;bottom:12px;right:12px;z-index:101;background:#1e293b;border:1px solid #334155;color:#94a3b8;padding:6px 12px;border-radius:8px;font-size:12px;cursor:pointer">📋 Logs</button>

  <script>
    let logWs = null;
    let logVisible = false;
    const LOG_MAX = 500;

    function toggleLogPanel() {
      logVisible = !logVisible;
      const panel = document.getElementById('log-panel');
      panel.style.display = logVisible ? 'flex' : 'none';
      if (logVisible && !logWs) connectLogs();
    }

    function connectLogs() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      logWs = new WebSocket(`${proto}://${location.host}/api/ws/logs`);
      const content = document.getElementById('log-content');
      const lines = [];

      logWs.onmessage = (evt) => {
        if (!evt.data) return;
        lines.push(evt.data);
        if (lines.length > LOG_MAX) lines.shift();
        content.textContent = lines.join('\n');
        content.scrollTop = content.scrollHeight;
      };

      logWs.onclose = () => { logWs = null; };
    }
  </script>
</body>
</html>
